name: Tessaya voice proof

# Installs a Tessaya build on a Windows desktop, launches it with BATON_TEST_WAV (a spoken wake phrase made
# with Windows speech) and BATON_TEST_DIR, and reads voice-turns.ndjson: how far did the voice start get, did
# the audio hook run, did the phrase wake it. Give `tag` (baton-v0.1.31) to test a released installer, or
# leave it empty to build this branch (about 10 minutes more). With `stranger` on (the default), the same run
# also proves what a person who is not the maintainer gets: a clean machine, a first run, nothing private, and an
# uninstall that leaves the user's data (scripts/baton/stranger-proof.ps1).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""
      stranger:
        type: boolean
        default: true
      require_wake:
        type: boolean
        default: true
      smoke_only:
        type: boolean
        default: false
      smoke_args:
        type: string
        default: ""
      smoke_env:
        type: string
        default: ""
      perf_enforce:
        type: boolean
        default: false
      starved_only:
        type: boolean
        default: false
      upgrade_from:
        type: string
        default: ""
      upgrade_to:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag to install, e.g. baton-v0.1.31; empty builds this ref"
        default: ""
      stranger:
        description: "Stranger-install proof: clean machine, first run, no private defaults, uninstall (adds two steps around the voice proof)"
        type: boolean
        default: true
      require_wake:
        description: "Also fail unless the phrase woke it (a synthetic voice may not)"
        type: boolean
        default: true
      smoke_only:
        description: "Skip the Windows job; run only the Linux and macOS smoke jobs"
        type: boolean
        default: false
      smoke_args:
        description: "Extra launch arguments for the smoke jobs (an experiment)"
        default: ""
      smoke_env:
        description: "Extra environment for the smoke jobs, KEY=VALUE separated by spaces (an experiment)"
        default: ""
      perf_enforce:
        description: "Fail the resource step when a budget in scripts/baton/perf-budgets.json is exceeded"
        type: boolean
        default: false
      starved_only:
        description: "In the resource step, run only the starved starts (skip the four 60 s phases)"
        type: boolean
        default: false
      upgrade_from:
        description: "Upgrade proof: the older release tag to install first (empty skips the proof)"
        default: ""
      upgrade_to:
        description: "Upgrade proof: the newer release tag to install over it (default baton-v0.1.44)"
        default: ""

permissions:
  contents: read

jobs:
  prove:
    if: ${{ !inputs.smoke_only && inputs.upgrade_from == '' }}
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Download the released installer
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir installer
          gh release download "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --dir installer --pattern '*-x64.exe'
          ls installer

      - name: Apply Tessaya branding (build only, not committed)
        if: inputs.tag == ''
        shell: bash
        run: bash scripts/baton/apply-release-branding.sh

      - name: T3 Connect public config
        if: inputs.tag == ''
        shell: bash
        run: bash scripts/baton/hosted-public-config.sh >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: inputs.tag == ''
        with:
          node-version-file: package.json

      - uses: actions/setup-python@v5
        if: inputs.tag == ''
        with:
          python-version: "3.x"

      - name: Setup pnpm
        if: inputs.tag == ''
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.tag == ''
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        if: inputs.tag == ''
        run: pnpm install --frozen-lockfile

      - name: Build the installer
        if: inputs.tag == ''
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 \
            --build-version 99.0.0 --output-dir installer --verbose

      - name: "Stranger - clean start, install, first run, nothing private"
        if: inputs.stranger
        shell: pwsh
        run: |
          $exe = (Get-ChildItem installer -Filter '*-x64.exe' | Where-Object { $_.Name -notmatch 'blockmap' } | Select-Object -First 1).FullName
          ./scripts/baton/stranger-proof.ps1 -Phase first -Installer $exe -Out "$env:RUNNER_TEMP/stranger-proof"

      - name: Install, launch with the test audio, read the log
        shell: pwsh
        run: |
          $exe = (Get-ChildItem installer -Filter '*-x64.exe' | Where-Object { $_.Name -notmatch 'blockmap' } | Select-Object -First 1).FullName
          $extra = @{}
          if ('${{ inputs.require_wake }}' -ne 'false') { $extra.RequireWake = $true }
          ./scripts/baton/voice-proof.ps1 -Installer $exe -Out "$env:RUNNER_TEMP/voice-proof" @extra

      - name: Resource budget (idle, wake-listen, dictation, assistant turn, starved start)
        shell: pwsh
        run: ./scripts/baton/resource-proof.ps1 -Out "$env:RUNNER_TEMP/resource-proof" ${{ inputs.perf_enforce && '-Enforce' || '' }} ${{ inputs.starved_only && '-OnlyStarved' || '' }}

      - name: "Stranger - uninstall keeps the user's data, removes the app"
        if: inputs.stranger
        shell: pwsh
        run: ./scripts/baton/stranger-proof.ps1 -Phase uninstall -Out "$env:RUNNER_TEMP/stranger-proof"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stranger-proof
          path: ${{ runner.temp }}/stranger-proof

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-proof
          path: ${{ runner.temp }}/voice-proof

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-proof
          path: ${{ runner.temp }}/resource-proof
          if-no-files-found: ignore

  # Upgrade in place: install release `upgrade_from`, let it fetch its models, install release `upgrade_to` over it, and assert that
  # nothing under voice\models or voice\pocket was fetched, hashed or rewritten (scripts/baton/upgrade-proof.ps1).
  upgrade:
    if: ${{ inputs.upgrade_from != '' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Download both installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir from to
          gh release download "${{ inputs.upgrade_from }}" -R "$GITHUB_REPOSITORY" --dir from --pattern '*-x64.exe'
          gh release download "${{ inputs.upgrade_to != '' && inputs.upgrade_to || 'baton-v0.1.44' }}" -R "$GITHUB_REPOSITORY" --dir to --pattern '*-x64.exe'
          ls from to
      - name: Upgrade in place and compare
        shell: pwsh
        run: |
          $a = (Get-ChildItem from -Filter '*-x64.exe' | Where-Object { $_.Name -notmatch 'blockmap' } | Select-Object -First 1).FullName
          $b = (Get-ChildItem to -Filter '*-x64.exe' | Where-Object { $_.Name -notmatch 'blockmap' } | Select-Object -First 1).FullName
          ./scripts/baton/upgrade-proof.ps1 -From $a -To $b -Out "$env:RUNNER_TEMP/upgrade-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-proof
          path: ${{ runner.temp }}/upgrade-proof

  # macOS and Linux: launch a RELEASED build headless with the same test hooks and report how far it got
  # (docs/baton/PLATFORMS.md). With `tag` it installs the released build; without, it builds this ref the way
  # baton-desktop-release.yml does (no release is made).
  smoke:
    if: ${{ inputs.upgrade_from == '' }}
    name: smoke ${{ matrix.platform }}
    # macOS is reported, not required: its runner killed the app in 2 of 4 runs of the same build (docs/baton/PLATFORMS.md).
    continue-on-error: ${{ matrix.platform == 'macos' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            pattern: "*.AppImage"
          - platform: macos
            os: macos-latest
            pattern: "*arm64*.dmg"
    steps:
      - uses: actions/checkout@v6
      - name: Tools (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb espeak-ng ffmpeg libfuse2 libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Download the released build
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --dir release --pattern '${{ matrix.pattern }}'
          ls release
      - name: Apply Tessaya branding (build only, not committed)
        if: inputs.tag == ''
        run: bash scripts/baton/apply-release-branding.sh
      - uses: actions/setup-node@v4
        if: inputs.tag == ''
        with:
          node-version-file: package.json
      - name: Build tools (Linux)
        if: inputs.tag == '' && matrix.platform == 'linux'
        run: sudo apt-get install -y libsecret-1-dev pkg-config imagemagick build-essential cmake libasound2-dev libx11-dev libxi-dev libxtst-dev libxdo-dev libxkbcommon-dev libevdev-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.tag == ''
      - name: Build this ref
        if: inputs.tag == ''
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          export PATH="$PWD/node_modules/.bin:$PATH"
          if [ "${{ matrix.platform }}" = linux ]; then target="--platform linux --target AppImage"; else target="--platform mac --target dmg"; fi
          node scripts/build-desktop-artifact.ts $target --arch ${{ matrix.platform == 'linux' && 'x64' || 'arm64' }} \
            --build-version 99.0.0 --output-dir release --verbose
      - name: Launch with the test hooks
        env:
          # A synthetic voice does not wake the macOS build reliably; the wake phrase is required on Windows and Linux.
          REQUIRE_WAKE: ${{ inputs.require_wake && matrix.platform != 'macos' && '1' || '0' }}
          SMOKE_ARGS: ${{ inputs.smoke_args }}
          SMOKE_ENV: ${{ inputs.smoke_env }}
        run: bash scripts/baton/platform-smoke.sh "${{ matrix.platform }}" "$(find release \( -name "*.AppImage" -o -name "*.dmg" \) | head -1)" "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.platform }}
          path: ${{ runner.temp }}/smoke
