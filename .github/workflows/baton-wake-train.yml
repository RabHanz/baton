name: Tessaya wake word training

# Free GitHub-hosted CPU runners (public repo). Pushing this branch runs it; models come back as artifacts.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps (a few thousand for a smoke run that reaches validation)"
        default: "250000"
      samples:
        description: "Positive clips to synthesise"
        default: "45000"
      word:
        description: "One word to train (sebastian, alfred, freya, onyx, tessaya)"
        required: true
        default: tessaya
      clean:
        description: "Licence-clean data only (MIT release): LibriSpeech, MUSAN, CC BY voices"
        type: boolean
        default: true
  push:
    branches: [baton/wake-train]
    paths: [".github/workflows/baton-wake-train.yml", "scripts/baton/wake-train/**"]

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        word: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.word)) || fromJSON('["sebastian","alfred","freya","onyx"]') }}
    env:
      N_SAMPLES: ${{ github.event_name == 'workflow_dispatch' && inputs.samples || '30000' }}
      STEPS: ${{ github.event_name == 'workflow_dispatch' && inputs.steps || '100000' }}
      CLEAN: ${{ github.event_name == 'workflow_dispatch' && inputs.clean && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Make room (the negative features alone are 17 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng libsndfile1 ffmpeg
          df -h / | tail -1
      - name: Train
        env:
          WORD: ${{ matrix.word }}
        run: bash scripts/baton/wake-train/train.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wake-${{ matrix.word }}
          path: wake-work/out/
          if-no-files-found: warn
