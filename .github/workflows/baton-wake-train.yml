name: Baton wake word training

# Free GitHub-hosted CPU runners (public repo). Pushing this branch runs it; models come back as artifacts.
on:
  push:
    branches: [baton/wake-train]
    paths: [".github/workflows/baton-wake-train.yml", "scripts/baton/wake-train/**"]

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        word: [sebastian, alfred, freya]
    env:
      N_SAMPLES: 30000
      STEPS: 50000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Make room (the negative features alone are 17 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng libsndfile1 ffmpeg
          df -h / | tail -1
      - name: Train
        env:
          WORD: ${{ matrix.word }}
        run: bash scripts/baton/wake-train/train.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wake-${{ matrix.word }}
          path: wake-work/out/
          if-no-files-found: warn
