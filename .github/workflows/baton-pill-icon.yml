name: Tessaya pill icon in every state

# The pill page in a real window on Windows, in every state including the resting always-on capsule: the icon must load when shown.
on:
  workflow_dispatch:
  push:
    branches: ["baton/c-pill-icon**"]

permissions:
  contents: read

jobs:
  click:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        working-directory: apps/desktop
        run: node node_modules/electron/install.js
      - name: Bundle the harness
        shell: bash
        working-directory: apps/desktop
        run: |
          esbuild="$(ls -d ../../node_modules/.pnpm/esbuild@*/node_modules/esbuild/bin/esbuild | tail -1)"
          mkdir -p node_modules/.cache/baton-smoke
          "$esbuild" src/baton/screen/smoke/pillIconProof.ts --bundle --platform=node --format=cjs \
            --external:electron --external:onnxruntime-node --log-level=warning \
            --outfile=node_modules/.cache/baton-smoke/pillIconProof.cjs
      - name: Walk the pill through every state
        shell: bash
        working-directory: apps/desktop
        env:
          PROOF_OUT: ${{ github.workspace }}/pill-icon-out
        run: |
          mkdir -p "$PROOF_OUT"
          timeout 300 "$(node -p 'require("electron")')" node_modules/.cache/baton-smoke/pillIconProof.cjs 2>&1 | tee "$PROOF_OUT/run.log"; echo "exit=${PIPESTATUS[0]}" >> "$PROOF_OUT/run.log"
          cat "$PROOF_OUT/results.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pill-icon
          path: pill-icon-out
          if-no-files-found: warn
