name: Tessaya teach quality set

# The real companion and the real overlay on a Windows desktop (design: docs/baton/research/teach-mode-2026-11-02.md).
# A scripted `claude` answers (a runner has no model login); each scenario is taught (the harness is the user) and
# recorded as an mp4 with a six-frame contact sheet.
on:
  workflow_dispatch:
  push:
    branches: ["baton/teach-matrix**"]

permissions:
  contents: read

jobs:
  prove:
    name: ${{ matrix.app }}
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        app: [notepad, calculator, paint, explorer, settings, edge]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: native/baton-dictation/target
          key: sidecar-${{ runner.os }}-${{ hashFiles('native/baton-dictation/Cargo.lock', 'native/baton-dictation/src/**') }}
          restore-keys: sidecar-${{ runner.os }}-
      - name: Build the UI Automation sidecar
        shell: bash
        env:
          TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --manifest-path native/baton-dictation/Cargo.toml
      - name: Fetch the Electron binary
        working-directory: apps/desktop
        run: node node_modules/electron/install.js
      - name: Install ffmpeg for the recordings
        shell: bash
        run: |
          choco install ffmpeg --no-progress -y > /dev/null || echo "no ffmpeg, so no clips"
      - name: Bundle the harness
        shell: bash
        working-directory: apps/desktop
        run: |
          esbuild="$(ls -d ../../node_modules/.pnpm/esbuild@*/node_modules/esbuild/bin/esbuild | tail -1)"
          mkdir -p node_modules/.cache/baton-smoke
          "$esbuild" src/baton/screen/smoke/teachProof.ts --bundle --platform=node --format=cjs \
            --external:electron --external:onnxruntime-node --log-level=warning \
            --outfile=node_modules/.cache/baton-smoke/teachProof.cjs
      - name: Run teach, recorded
        timeout-minutes: 35
        shell: bash
        working-directory: apps/desktop
        env:
          PROOF_OUT: ${{ github.workspace }}/teach-proof-out
          PROOF_APP: ${{ matrix.app }}
          PROOF_FAKE: ${{ github.workspace }}/scripts/tessaya/teach-proof/fake-claude.mjs
          SIDECAR: ${{ github.workspace }}/native/baton-dictation/target/release/tessaya-voice.exe
          HANDS_RECORD: "1"
        run: |
          mkdir -p "$PROOF_OUT"
          timeout 1700 "$(node -p 'require("electron")')" node_modules/.cache/baton-smoke/teachProof.cjs 2>&1 | tee "$PROOF_OUT/run.log" || true
          cat "$PROOF_OUT/results.json" || echo "no results"
          cat "$PROOF_OUT/results.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teach-matrix-${{ matrix.app }}
          path: teach-proof-out
          if-no-files-found: warn
