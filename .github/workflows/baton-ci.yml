name: baton-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: baton-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baton-ci:
    name: baton-ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci-deps

      - name: Typecheck (new errors fail; known ones sit in typecheck-baseline.txt)
        run: node scripts/tessaya/typecheck-gate.mjs

      - name: Lint (errors fail; it was not gated before and had drifted to 115)
        run: vp lint --report-unused-disable-directives

      - name: Unit tests of changed Baton files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [[ -z "$base" || "$base" == 0000000* ]] || ! git cat-file -e "$base" 2>/dev/null; then base=HEAD~1; fi
          changed=$(git diff --name-only --diff-filter=d "$base"...HEAD 2>/dev/null || git diff --name-only --diff-filter=d "$base" HEAD)
          # An upstream sync changes hundreds of upstream test files; those are upstream's to run (they need browsers and
          # tools this runner does not have), so past this many only Baton's own tests are run.
          upstream_wave=0
          if [ "$(echo "$changed" | grep -cE '\.test\.tsx?$' || true)" -gt 150 ]; then upstream_wave=1; echo "upstream sync: running Baton's own tests only"; fi
          for ws in apps/server apps/desktop packages/baton-shared packages/baton-voice packages/baton-contracts; do
            pattern="^$ws/.*(baton|Baton).*\.test\.tsx?$|^$ws/.*\.test\.ts$"
            [ "$upstream_wave" -eq 1 ] && pattern="^$ws/.*(baton|Baton|Tessaya|Phone|Intent|WorkSession|Fleet).*\.test\.tsx?$"
            files=$(echo "$changed" | grep -E "$pattern" | grep -vE '\.browser\.test\.' | sed "s|^$ws/||" || true)
            if [[ "$ws" == packages/baton-* ]]; then files=$(echo "$changed" | grep -E "^$ws/.*\.test\.ts$" | sed "s|^$ws/||" || true); fi
            [[ -z "$files" ]] && continue
            echo "== $ws: $(echo $files | wc -w) test files"
            (cd "$ws" && vp test run $files)
          done

      # The server crashed at start after a sync (a route registered twice) and no check ran the server. When the
      # server's own code or the patches change, build the Linux archive and run its CLI smoke test, as a release would.
      - name: Does the server start? (when the server or the patches changed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [[ -z "$base" || "$base" == 0000000* ]] || ! git cat-file -e "$base" 2>/dev/null; then base=HEAD~1; fi
          if ! git diff --name-only "$base"...HEAD | grep -qE '^(apps/server/src/|vendor-patches/|packages/baton-contracts/|apps/server/package.json)'; then
            echo "nothing the server runs changed; skipping"; exit 0
          fi
          rustup toolchain install stable --profile minimal > /dev/null 2>&1 || true
          cargo build --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "$RUNNER_TEMP/resource-monitor/linux-x64"
          cp native/resource-monitor/target/release/t3-resource-monitor "$RUNNER_TEMP/resource-monitor/linux-x64/"
          export BATON_RESOURCE_MONITOR_DIR="$RUNNER_TEMP/resource-monitor"
          NODE_ENV=production bash scripts/tessaya/release-build.sh 0.0.0-baton.0

      # Not a gate: the barge-in detector's measured numbers, printed whenever the voice package changes (docs/baton/BARGE_IN.md).
      - name: Barge-in detector, measured (report only)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${BASE_SHA:-}"
          if [[ -z "$base" || "$base" == 0000000* ]] || ! git cat-file -e "$base" 2>/dev/null; then base=HEAD~1; fi
          if git diff --name-only "$base"...HEAD | grep -qE '^(packages/baton-voice/src/(echo|core)|native/baton-aec/|scripts/tessaya/aec-eval)'; then
            node scripts/tessaya/bargein-eval.ts 60 | tee "$RUNNER_TEMP/bargein.txt"
            cat "$RUNNER_TEMP/bargein.txt" >> "$GITHUB_STEP_SUMMARY"
            echo "--- WebRTC AEC3 ---" | tee -a "$GITHUB_STEP_SUMMARY"
            rustup update stable --no-self-update > /dev/null 2>&1 || true
            cargo build --release --manifest-path native/baton-aec/Cargo.toml
            for cfg in "0.5 0 0.42" "0.5 1 0.42" "0.5 0 1.5" "0.5 1 1.5" "0.3 0 1.5" "0.5 0.5 1.5"; do
              set -- $cfg
              AEC_VAD=$1 AEC_FLOOR_K=$2 AEC_WINDOW_S=$3 node scripts/tessaya/aec-eval.ts native/baton-aec/target/release/aec-eval 60 | head -1 | tee -a "$RUNNER_TEMP/aec.txt"
            done
            cat "$RUNNER_TEMP/aec.txt" >> "$GITHUB_STEP_SUMMARY"
          else echo "voice core and echo guard unchanged; skipping"; fi
