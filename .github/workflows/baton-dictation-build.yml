name: Tessaya dictation build

# Builds the sidecar on its own for every platform, so it can be tried without a desktop release. Windows is the
# one the app shipped with; Linux x64 and macOS arm64 + x64 are built and tested here the same way.
on:
  push:
    branches: [main]
    paths: ["native/baton-dictation/**", ".github/workflows/baton-dictation-build.yml"]
  pull_request:
    paths: ["native/baton-dictation/**", ".github/workflows/baton-dictation-build.yml"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        env:
          # Portable AVX2 floor: the runner's own CPU may be newer than the laptop's i7-8550U.
          TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          # Nothing installs the VC++ redistributable, so the exe must not need it.
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo test --release --locked --manifest-path native/baton-dictation/Cargo.toml
          cargo build --release --locked --manifest-path native/baton-dictation/Cargo.toml
          if grep -aqiE 'MSVCP140|VCRUNTIME140' native/baton-dictation/target/release/tessaya-voice.exe; then
            echo "tessaya-voice.exe still imports the VC++ runtime" >&2
            exit 1
          fi
      - name: Windows names the process Tessaya
        shell: pwsh
        run: |
          $v = (Get-Item native/baton-dictation/target/release/tessaya-voice.exe).VersionInfo
          $v | Format-List FileDescription, ProductName, CompanyName, FileVersion
          if ($v.FileDescription -ne 'Tessaya voice' -or $v.ProductName -ne 'Tessaya') { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: baton-dictation-win-x64
          path: |
            native/baton-dictation/target/release/tessaya-voice.exe
            native/baton-dictation/Cargo.lock

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (audio, keyboard, clang for bindgen)
        run: sudo apt-get update && sudo apt-get install -y cmake libasound2-dev libx11-dev libxi-dev libxtst-dev libxdo-dev libxkbcommon-dev libevdev-dev libclang-dev pkg-config
      - name: Test and build
        env:
          # Portable AVX2 floor, as on Windows: the runner's CPU may be newer than the user's.
          TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON
        run: |
          cargo test --release --locked --manifest-path native/baton-dictation/Cargo.toml
          cargo build --release --locked --manifest-path native/baton-dictation/Cargo.toml
          ldd native/baton-dictation/target/release/tessaya-voice | tee ldd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: baton-dictation-linux-x64
          path: |
            native/baton-dictation/target/release/tessaya-voice
            ldd.txt

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            cmake: -DGGML_NATIVE=OFF -DCMAKE_OSX_ARCHITECTURES=arm64
          - arch: x64
            target: x86_64-apple-darwin
            cmake: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON -DCMAKE_OSX_ARCHITECTURES=x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (tests run for the native arm64 build)
        env:
          TRANSCRIBE_CMAKE_ARGS: ${{ matrix.cmake }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          if [ "${{ matrix.arch }}" = arm64 ]; then cargo test --release --locked --manifest-path native/baton-dictation/Cargo.toml --target ${{ matrix.target }}; fi
          cargo build --release --locked --manifest-path native/baton-dictation/Cargo.toml --target ${{ matrix.target }}
          otool -L native/baton-dictation/target/${{ matrix.target }}/release/tessaya-voice | tee otool.txt
      - uses: actions/upload-artifact@v4
        with:
          name: baton-dictation-macos-${{ matrix.arch }}
          path: |
            native/baton-dictation/target/${{ matrix.target }}/release/tessaya-voice
            otool.txt
