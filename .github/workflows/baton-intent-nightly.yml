# Nightly: the labelled sentences through the real router on a real Claude login. Skipped, not failed,
# when the repository has no CLAUDE_CODE_OAUTH_TOKEN secret. The model-free version is a unit test.
name: Tessaya intent accuracy (nightly)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  intent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Is there a login to use?
        id: login
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN secret: skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.login.outputs.have == 'true'
      - uses: ./.github/actions/setup-ci-deps
        if: steps.login.outputs.have == 'true'
      - name: Install Claude Code
        if: steps.login.outputs.have == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the sentences
        if: steps.login.outputs.have == 'true'
        run: node scripts/tessaya/intent-nightly.ts --claude claude
