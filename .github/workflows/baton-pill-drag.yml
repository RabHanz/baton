name: Tessaya pill drag

# The real pill window dragged with the real mouse on Windows, then rebuilt over the same state folder: it must move and stay.
on:
  workflow_dispatch:
  push:
    branches: ["baton/c-pill-icon**"]

permissions:
  contents: read

jobs:
  click:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        working-directory: apps/desktop
        run: node node_modules/electron/install.js
      - name: Install ffmpeg for the recording
        shell: bash
        run: |
          choco install ffmpeg --no-progress -y > /dev/null || echo "no ffmpeg, so no clip"
      - name: Bundle the harness
        shell: bash
        working-directory: apps/desktop
        run: |
          esbuild="$(ls -d ../../node_modules/.pnpm/esbuild@*/node_modules/esbuild/bin/esbuild | tail -1)"
          mkdir -p node_modules/.cache/baton-smoke
          "$esbuild" src/baton/screen/smoke/pillDragProof.ts --bundle --platform=node --format=cjs \
            --external:electron --external:onnxruntime-node --log-level=warning \
            --outfile=node_modules/.cache/baton-smoke/pillDragProof.cjs
      - name: Drag the pill with the real mouse, recorded
        shell: bash
        working-directory: apps/desktop
        env:
          PROOF_OUT: ${{ github.workspace }}/pill-drag-out
        run: |
          mkdir -p "$PROOF_OUT"
          timeout 300 "$(node -p 'require("electron")')" node_modules/.cache/baton-smoke/pillDragProof.cjs 2>&1 | tee "$PROOF_OUT/run.log"; echo "exit=${PIPESTATUS[0]}" >> "$PROOF_OUT/run.log"
          cat "$PROOF_OUT/results.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pill-drag
          path: pill-drag-out
          if-no-files-found: warn
