name: Tessaya Home click-through

# Every sidebar item, header control and settings-dialog tab of the real Home window, clicked with the real mouse on a
# Windows desktop; the table of which ones did something visible goes to the run's summary, with a recording.
on:
  workflow_dispatch:
  push:
    branches: ["baton/home-click**"]
  pull_request:
    paths:
      - "apps/desktop/src/baton/home/**"
      - "apps/desktop/src/baton/screen/smoke/homeClickThrough.ts"
      - ".github/workflows/baton-home-click.yml"

permissions:
  contents: read

jobs:
  click:
    name: click (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: plain, os: windows-2022, laptop: "0" }
          - { name: laptop-like, os: windows-2025, laptop: "1" }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        working-directory: apps/desktop
        run: node node_modules/electron/install.js
      - name: Install ffmpeg for the recording
        shell: bash
        run: |
          choco install ffmpeg --no-progress -y > /dev/null || echo "no ffmpeg, so no clip"
      - name: Bundle the harness
        shell: bash
        working-directory: apps/desktop
        run: |
          esbuild="$(ls -d ../../node_modules/.pnpm/esbuild@*/node_modules/esbuild/bin/esbuild | tail -1)"
          mkdir -p node_modules/.cache/baton-smoke
          "$esbuild" src/baton/screen/smoke/homeClickThrough.ts --bundle --platform=node --format=cjs \
            --external:electron --external:onnxruntime-node --log-level=warning \
            --outfile=node_modules/.cache/baton-smoke/homeClick.cjs
      - name: Click everything, recorded
        shell: bash
        working-directory: apps/desktop
        env:
          PROOF_OUT: ${{ github.workspace }}/home-click-out
          HOME_CLICK_LAPTOP: ${{ matrix.laptop }}
        run: |
          mkdir -p "$PROOF_OUT"
          set +e
          timeout 900 "$(node -p 'require("electron")')" node_modules/.cache/baton-smoke/homeClick.cjs 2>&1 | tee "$PROOF_OUT/run.log"
          cat "$PROOF_OUT/results.md" >> "$GITHUB_STEP_SUMMARY"
          # A control that does nothing, or a page error, fails the run.
          grep -q "| no effect \|| not found \|| past the work area \|Page errors" "$PROOF_OUT/results.md" && exit 1
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-click-${{ matrix.name }}
          path: home-click-out
          if-no-files-found: warn
