name: Baton desktop release

# Builds the Baton desktop app (apps/desktop) for Windows, macOS and Linux on
# GitHub-hosted runners (free, unlimited minutes on a public repo) and
# publishes the installers to a GitHub Release that electron-updater already
# knows how to read (see apps/desktop/src/updates/DesktopUpdates.ts and
# scripts/build-desktop-artifact.ts#resolveGitHubPublishConfig, which infers
# the update feed from the GITHUB_REPOSITORY env var GitHub Actions sets
# automatically — no code change needed here).
#
# This intentionally does NOT reuse .github/workflows/release-desktop.yml /
# release.yml: those are upstream pingdotgg/t3code's own pipeline, gated to
# `github.repository == 'pingdotgg/t3code'` and built around their paid
# blacksmith-* runners, Azure Trusted Signing, CLI archives and a WSL runtime
# bundle. None of that is available or needed here; this is the minimum
# pipeline that gets an installable, self-updating build out.
#
# Unsigned: Windows SmartScreen and macOS Gatekeeper will warn on first run
# ("Windows protected your PC" / "unidentified developer"). A Windows
# code-signing cert (e.g. Azure Trusted Signing, ~$10-30/mo, or an EV cert
# ~$300+/yr) or an Apple Developer ID ($99/yr) removes those warnings; add
# CSC_LINK/CSC_KEY_PASSWORD or Azure secrets later without changing this
# workflow's structure — electron-builder picks them up automatically.

on:
  push:
    tags:
      - "baton-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (tag baton-v<version> is created at the current commit if it doesn't exist)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: baton-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve_version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#baton-v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be X.Y.Z, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=baton-v$version" >> "$GITHUB_OUTPUT"

  build_linux:
    name: Build Linux (AppImage, x64)
    needs: resolve_version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Apply Baton branding (release build only, not committed)
        shell: bash
        run: bash scripts/baton/apply-release-branding.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup pnpm
        run: corepack enable

      - name: Install Linux desktop build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux AppImage
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Invoked directly (not via `pnpm run`) so the --build-version/--output-dir
        # flags reach the script's own CLI parser; `pnpm run script -- extra-flags`
        # forwards the literal "--" too, which this script's CLI parser (Effect
        # cli) treats as an end-of-flags marker and rejects everything after as
        # positional args. node_modules/.bin is added to PATH by hand because the
        # script shells out to `vp`, which only normally resolves when pnpm itself
        # invokes the script (pnpm prepends it to PATH for `pnpm run`).
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/build-desktop-artifact.ts --platform linux --target AppImage --arch x64 \
            --build-version "${{ needs.resolve_version.outputs.version }}" --output-dir release --verbose

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baton-linux-x64
          path: |
            release/*.AppImage
            release/*.yml
          if-no-files-found: error

  build_windows:
    name: Build Windows (NSIS, x64)
    needs: resolve_version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Apply Baton branding (release build only, not committed)
        shell: bash
        run: bash scripts/baton/apply-release-branding.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 \
            --build-version "${{ needs.resolve_version.outputs.version }}" --output-dir release --verbose

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baton-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  build_macos:
    name: Build macOS (DMG, arm64 + x64)
    needs: resolve_version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Apply Baton branding (release build only, not committed)
        shell: bash
        run: bash scripts/baton/apply-release-branding.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS DMG (arm64)
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 \
            --build-version "${{ needs.resolve_version.outputs.version }}" --output-dir release-arm64 --verbose

      - name: Build macOS DMG (x64)
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch x64 \
            --build-version "${{ needs.resolve_version.outputs.version }}" --output-dir release-x64 --verbose

      - name: Rename x64 update manifest
        # electron-builder names the mac update feed "latest-mac.yml" for
        # whichever build makes it; keep arm64's name as-is (the default
        # electron-updater looks for) and suffix x64's so both can coexist on
        # one release, matching the convention release-desktop.yml already
        # uses upstream.
        run: |
          if [[ -f release-x64/latest-mac.yml ]]; then
            mv release-x64/latest-mac.yml release-x64/latest-mac-x64.yml
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baton-macos
          path: |
            release-arm64/*.dmg
            release-arm64/*.zip
            release-arm64/*.blockmap
            release-arm64/*.yml
            release-x64/*.dmg
            release-x64/*.zip
            release-x64/*.blockmap
            release-x64/*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [resolve_version, build_linux, build_windows, build_macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( \
            -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o \
            -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \
          \) ! -name 'builder-debug.yml' -exec cp {} dist/ \;
          ls -la dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve_version.outputs.tag }}"
          version="${{ needs.resolve_version.outputs.version }}"
          if ! git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "Baton desktop v$version" \
              --notes "Baton desktop app v$version. Unsigned build — Windows SmartScreen / macOS Gatekeeper will warn on first run; click through (Windows: More info -> Run anyway; macOS: right-click -> Open)."
          fi
