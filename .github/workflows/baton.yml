# Baton's own check, on GitHub-hosted runners. Upstream's ci.yml needs Blacksmith runners this
# repository does not have (D77); the full gates run locally via scripts/baton/gates.sh.
name: Tessaya patch series

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Nothing private ships by default
        run: node scripts/baton/guard-private.mjs
      - name: Every shipped third-party piece has a notice
        run: |
          node scripts/baton/check-notices.mjs
          node --test scripts/baton/check-notices.test.mjs
      - name: Status-file writer
        run: node --test scripts/baton/status-file.test.mjs scripts/baton/cloud-logins.test.mjs scripts/baton/live/answer-review.test.mjs
      - name: Upstream paths equal PIN + series
        run: bash scripts/baton/patches.sh verify
      - name: patches.sh self-test
        run: |
          git config --global user.email ci@baton.invalid
          git config --global user.name ci
          bash scripts/baton/patches.test.sh
