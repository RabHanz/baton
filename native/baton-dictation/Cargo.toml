[package]
name = "baton-dictation"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "baton-dictation"
path = "src/main.rs"

[dependencies]
# Handy's engine, microphone and hotkey crates (all MIT). Static CPU build: one exe, no DLLs.
transcribe-cpp = { version = "=0.4.1", default-features = false }
handy-recorder = "=0.1.0"
handy-keys = "=0.3.4"
enigo = "0.6.1"
hound = "3.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
